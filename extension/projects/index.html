<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <script src="theme.js" defer></script>
        <title>Projects | CoBlocks</title>
        <link rel="stylesheet" href="/projects/style.css">
    </head>
    <body>
        <header>
            <img id="logo" src="/img/CoBlocksIcon.png" alt="CoBlocks">
            <span id="title">CoBlocks</span>
            <span id="version"></span>
            <img id="switch-theme" class="button"></img>
        </header>
        <div id="contents">
            <img id="floating-logo-back" src="/img/CoBlocksIcon.png" alt="">
            <img id="floating-logo" src="/img/CoBlocksIcon.png" alt="">
            <div class="group">
                <span class="eyebrow">Workspace</span>
                <span class="title">Your CoBlocks projects</span>
                <info>Projects you own and projects shared with you.</info>
            </div>
            <div class="projects"></div>
        </div>
    </body>
    <script src="/projects/script.js"></script>
</html>
